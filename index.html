<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>小小杜的三亚记忆</title>
    <style>
      :root {
        --paper: #f6efe3;
        --paper-deep: #efe4d0;
        --card: #fffdf8;
        --ink: #3d3226;
        --ink-soft: #7a6a55;
        --accent: #a8552f;
        --accent-soft: #c98d5f;
        --line: #e3d5bd;
        --shadow: 0 10px 28px rgba(93, 64, 32, 0.16);
        --shadow-sm: 0 4px 14px rgba(93, 64, 32, 0.12);
        --overlay: rgba(43, 33, 22, 0.92);
        --radius: 18px;
        --badge-bg: rgba(38, 26, 16, 0.78);
        --badge-ink: #fdf6e9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #241c14;
          --paper-deep: #2d2318;
          --card: #33291d;
          --ink: #f0e6d6;
          --ink-soft: #bfae94;
          --accent: #e09a63;
          --accent-soft: #c98d5f;
          --line: #4a3b28;
          --shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
          --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.4);
          --overlay: rgba(16, 12, 8, 0.94);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--paper);
        background-image: radial-gradient(var(--paper-deep) 1px, transparent 1px);
        background-size: 22px 22px;
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        line-height: 1.6;
      }
      .serif { font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif; }
      main { max-width: 1060px; margin: 0 auto; padding: 28px 18px 56px; }

      /* ---------- 首页 ---------- */
      .home-head { text-align: center; padding: 14px 6px 26px; }
      .home-head .over { font-size: 13px; letter-spacing: 0.35em; color: var(--accent); margin: 0 0 10px; }
      .home-head h1 { font-size: 34px; margin: 0 0 10px; font-weight: 700; letter-spacing: 0.06em; }
      .home-head p { margin: 0 auto; max-width: 30em; color: var(--ink-soft); font-size: 15px; }

      .theme-card {
        display: block; width: 100%; text-align: left; cursor: pointer;
        background: var(--card); border: 1px solid var(--line); border-radius: 24px;
        padding: 14px 14px 20px; box-shadow: var(--shadow);
        font: inherit; color: inherit;
      }
      .theme-card:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
      .theme-cover { border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; background: var(--paper-deep); }
      .theme-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .theme-body { padding: 18px 8px 0; }
      .theme-body h2 { font-size: 24px; margin: 0 0 6px; letter-spacing: 0.04em; }
      .theme-body .intro { margin: 0 0 14px; color: var(--ink-soft); font-size: 15px; }
      .theme-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .theme-count { font-size: 13px; color: var(--ink-soft); }
      .theme-open {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--accent); color: #fff8ef; border: none;
        font-size: 15px; padding: 10px 20px; border-radius: 999px; cursor: pointer;
      }
      @media (min-width: 720px) {
        .theme-card { padding: 18px 18px 24px; }
        .theme-cover { aspect-ratio: 16 / 8; }
        .home-head h1 { font-size: 40px; }
      }
      /* ---------- 首页排版：所有尺寸按一屏高度排版 ----------
         首页（不分宽窄）改为按动态视口高度排版的弹性列：容器高度取 100dvh，
         并由脚本按 visualViewport 量到的实际可视高度写入 --app-vh 兜底
         （避开移动端浏览器工具栏占高），同时兼容安全区；页面外框本身不滚动，
         页头固定，滚动只发生在相册列表区内部（逐卡吸附，见下方 .home-albums）；
         卡片文字区固定高度，封面图在卡内弹性收缩（去掉固定宽高比），
         保证第一张相册卡一进来就完整显示封面、相册名、介绍与打开按钮，
         上滑后下一张卡也同样整卡对齐显示，不留半张卡在屏边。 */
      body:has(#homeView:not([hidden])) { overflow: hidden; overscroll-behavior: none; }
      main:has(> #homeView:not([hidden])) {
        height: 100vh; height: 100dvh; height: calc(var(--app-vh, 1vh) * 100);
        max-height: 100vh; max-height: 100dvh; max-height: calc(var(--app-vh, 1vh) * 100);
        overflow: hidden;
        display: flex; flex-direction: column;
        padding: calc(10px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
      }
      #homeView:not([hidden]) { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; width: 100%; }
      .home-head { flex: 0 0 auto; padding: 2px 6px 12px; }
      .home-head .over { margin-bottom: 6px; }
      .home-head h1 { font-size: 32px; margin-bottom: 6px; }
      .home-head p { font-size: 14px; }
      .theme-card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 12px 12px 14px; }
      .theme-cover { flex: 1 1 auto; min-height: 0; aspect-ratio: auto; }
      .theme-cover img { width: 100%; height: 100%; object-fit: cover; object-position: center center; }
      .theme-body { flex: 0 0 auto; padding: 12px 6px 0; }
      .theme-body h2 { font-size: 22px; margin-bottom: 4px; }
      .theme-body .intro { font-size: 14px; margin-bottom: 10px; }
      .theme-open { flex: none; white-space: nowrap; }
      /* 宽且高的大屏：页头与卡片回到舒展尺寸 */
      @media (min-width: 720px) and (min-height: 761px) {
        main:has(> #homeView:not([hidden])) { padding: calc(16px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) calc(24px + env(safe-area-inset-left, 0px)); }
        .home-head h1 { font-size: 38px; }
        .home-head p { font-size: 15px; }
        .theme-card { padding: 14px 14px 16px; }
        .theme-body { padding: 12px 8px 0; }
        .theme-body h2 { font-size: 23px; }
        .theme-body .intro { font-size: 15px; }
      }
      /* 矮屏（横屏手机、平板分屏等）：收紧页头，介绍最多两行，封面图随剩余高度继续收缩 */
      @media (max-height: 760px) {
        .home-head { padding-bottom: 8px; }
        .home-head .over { font-size: 12px; margin-bottom: 4px; }
        .home-head h1 { font-size: 30px; }
        .theme-body { padding-top: 10px; }
        .theme-body .intro { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      }
      /* 更矮的屏：字号与间距再收一档，页头副题限一行，按钮尺寸略缩但完整保留、绝不截断 */
      @media (max-height: 600px) {
        main:has(> #homeView:not([hidden])) { padding-top: calc(6px + env(safe-area-inset-top, 0px)); padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
        .home-head { padding: 0 6px 6px; }
        .home-head h1 { font-size: 26px; margin-bottom: 2px; }
        .home-head p { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .theme-card { padding: 10px 10px 12px; }
        .theme-body { padding: 8px 4px 0; }
        .theme-body h2 { font-size: 20px; margin-bottom: 2px; }
        .theme-body .intro { font-size: 13px; margin-bottom: 8px; }
        .theme-count { font-size: 12px; }
        .theme-open { padding: 8px 16px; font-size: 14px; }
      }
      /* 极矮屏（横屏小手机）：介绍限一行，封面图缩到剩余高度为止 */
      @media (max-height: 440px) {
        .home-head .over { font-size: 11px; margin-bottom: 2px; }
        .home-head h1 { font-size: 22px; }
        .theme-body h2 { font-size: 18px; }
        .theme-body .intro { -webkit-line-clamp: 1; margin-bottom: 6px; }
      }

      /* ---------- 首页：一级相册列表（可上滑浏览，逐卡吸附） ----------
         相册不再挤在一屏里平分高度：列表区自己上下滚动，每张相册卡占满
         列表区一整屏高度（卡片高度自适应内容但不超过一屏可用高度，
         封面图在卡内弹性收缩），滚动带吸附（scroll-snap），停下时卡片
         顶部与列表区顶部对齐、整卡完整显示，上下边缘不留半张卡片；
         后续再添加更多相册也同样逐卡上滑翻看。
         窄屏一列；宽屏两列同排，行高仍为一整屏，整行吸附对齐、不截断 */
      .home-albums {
        flex: 1 1 auto; min-height: 0; width: 100%;
        display: grid; grid-template-columns: 1fr; grid-auto-rows: 100%;
        gap: 14px;
        overflow-y: auto; overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
      }
      .home-albums::-webkit-scrollbar { display: none; }
      .home-albums .theme-card {
        scroll-snap-align: start; scroll-snap-stop: always;
        height: 100%; min-height: 0;
      }
      @media (min-width: 760px) { .home-albums { grid-template-columns: repeat(2, 1fr); } }

      /* ---------- 照片墙 ---------- */
      .wall-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 6px; }
      .back-btn {
        flex: none; margin-top: 0; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center;
        width: 44px; height: 44px; min-width: 44px; min-height: 44px;
        background: var(--paper); color: var(--accent); border: none;
        border-radius: 50%; padding: 0; font: inherit;
        box-shadow: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.18s ease, background 0.18s ease;
      }
      .back-btn:hover { background: var(--paper-deep); transform: translateY(-1px); }
      .back-btn:active { transform: translateY(0) scale(0.94); background: var(--paper-deep); }
      .back-btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
      .back-btn svg { display: block; flex: none; }
      @media (prefers-reduced-motion: reduce) {
        .back-btn { transition: none; }
        .back-btn:hover, .back-btn:active { transform: none; }
      }
      .wall-head h2 { font-size: 26px; margin: 0; letter-spacing: 0.04em; }
      .wall-head .sub { color: var(--ink-soft); font-size: 14px; margin: 2px 0 0; }
      /* ---------- 二级：相册照片网格（原网格样式） ----------
         手机一列、大屏自适应多列；点照片进三级卡片详情 */
      .photo-grid {
        margin-top: 20px;
        display: grid; grid-template-columns: 1fr; gap: 18px;
      }
      @media (min-width: 760px) { .photo-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (min-width: 1100px) { .photo-grid { grid-template-columns: repeat(3, 1fr); } }
      .photo-card {
        background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
        padding: 10px 10px 12px; box-shadow: var(--shadow-sm); cursor: pointer;
        text-align: left; font: inherit; color: inherit; width: 100%;
      }
      .photo-card:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
      .photo-card .frame { border-radius: 12px; overflow: hidden; background: var(--paper-deep); aspect-ratio: 4 / 3; }
      .photo-card img { width: 100%; height: 100%; object-fit: cover; object-position: center center; display: block; }
      .photo-card .cap { padding: 10px 6px 2px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      .photo-card .t { font-size: 17px; font-weight: 700; letter-spacing: 0.03em; }
      .photo-card .d { font-size: 13px; color: var(--ink-soft); flex: none; }
      /* 二级网格里的视频卡：16:9 封面 + 播放标记 + 时长角标 */
      .photo-card .frame.video-frame { aspect-ratio: 16 / 9; background: #1c130b; position: relative; }
      /* 竖屏视频：按自身比例（3:4 / 9:16，由脚本写入）直立显示，不横置、不裁成横幅 */
      .photo-card .frame.video-frame.portrait { width: 100%; max-width: 300px; margin: 0 auto; }
      .photo-card .frame.video-frame img { width: 100%; height: 100%; object-fit: cover; }
      .play-badge {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 52px; height: 52px; border-radius: 50%;
        background: rgba(30, 19, 10, 0.55); border: 1.5px solid rgba(253, 246, 233, 0.9);
        display: flex; align-items: center; justify-content: center; pointer-events: none;
      }
      .play-badge svg { width: 20px; height: 20px; margin-left: 3px; fill: #fdf6e9; }
      .dur-badge {
        position: absolute; right: 8px; bottom: 8px;
        background: var(--badge-bg); color: var(--badge-ink);
        font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 5px;
        font-variant-numeric: tabular-nums; letter-spacing: 0.04em; pointer-events: none;
      }
      .vtag {
        position: absolute; left: 8px; top: 8px;
        background: var(--badge-bg); color: var(--badge-ink);
        font-size: 11px; line-height: 1; padding: 4px 8px; border-radius: 5px; letter-spacing: 0.14em; pointer-events: none;
      }

      /* ---------- 详情：左右滑动翻看 ---------- */
      .detail {
        position: fixed; top: 0; left: 0; right: 0; bottom: auto; z-index: 50; background: var(--overlay);
        /* 高度按实际可视区算：先给整屏兜底，再用动态视口高度，最后用脚本量到的真实可视高度，
           避免 iPhone Safari 底部工具栏把卡片下半截挡住 */
        height: 100vh; height: 100dvh; height: calc(var(--app-vh, 1vh) * 100);
        display: flex; flex-direction: column;
        padding: 0;
      }
      .detail[hidden] { display: none; }
      .detail-bar {
        position: absolute; z-index: 100; pointer-events: none;
        top: max(10px, env(safe-area-inset-top)); left: 14px; right: 14px;
        width: auto; max-width: 720px; margin: 0 auto;
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        background: transparent;
      }
      .detail-count {
        color: #fff8ef; font-size: 13px; letter-spacing: 0.08em; flex: none;
        background: rgba(20, 14, 8, 0.38); border-radius: 999px; padding: 3px 10px;
        -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
        pointer-events: auto;
      }
      .close-btn {
        flex: none; cursor: pointer; border: 1px solid rgba(255, 248, 239, 0.35); background: rgba(20, 14, 8, 0.38);
        -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
        color: #fff8ef; border-radius: 50%; width: 40px; height: 40px; padding: 0;
        font: inherit; font-size: 14px; line-height: 1; pointer-events: auto;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .close-btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
      .detail-stage {
        flex: 1; min-height: 0; position: relative; z-index: 1; overflow: hidden; touch-action: none;
        overscroll-behavior: none;
      }
      /* ---------- 详情：卡片叠放 ----------
         所有详情卡绝对定位叠在舞台中央：当前卡在最前，后面的卡依次缩小、下移、变淡，
         像一摞卡片叠放；切换时前一张滑出、下一张从后面顶上来 */
      .detail-track {
        position: relative; width: 100%; height: 100%;
      }
      .detail-slide {
        position: absolute; inset: 0; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        /* 底部多留一段距离：卡片下沿也能越过 Safari 底部浮动工具栏完整露出 */
        padding: calc(max(10px, env(safe-area-inset-top)) + 42px) 10px calc(30px + env(safe-area-inset-bottom));
        transition: transform 0.3s cubic-bezier(0.22, 0.9, 0.28, 1), opacity 0.3s ease;
        will-change: transform, opacity;
      }
      .detail-stage.dragging .detail-slide { transition: none; }
      @media (prefers-reduced-motion: reduce) {
        .detail-slide { transition: none; }
      }
      .detail-item {
        width: 100%; max-width: 720px; max-height: 100%; margin: 0 auto;
        display: flex; flex-direction: column; overflow: hidden;
        background: var(--card); border: 1px solid var(--line); border-radius: 20px;
        padding: 10px 10px 9px; box-shadow: var(--shadow);
      }
      .detail-photo { cursor: zoom-in; flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; }
      .detail-photo .frame { flex: 0 1 auto; min-height: 0; }
      /* 照片容器 flex 居中 + 图片 object-position 居中：cover 裁切上下对称，照片始终居中显示，不贴顶 */
      .detail-photo .frame { border-radius: 12px; overflow: hidden; background: var(--paper-deep); display: flex; align-items: center; justify-content: center; }
      /* 详情图高度封顶在可视高度的一半多一点，竖图也不会把标题和信息顶出屏幕；点开全屏仍看原图比例 */
      .detail-photo img { width: 100%; display: block; object-fit: cover; object-position: center center; max-height: 60dvh; max-height: calc(var(--app-vh, 1vh) * 60); }
      /* 三级卡片里的视频封面：16:9，点封面进全屏播放 */
      .detail-photo .frame.video-frame { aspect-ratio: 16 / 9; background: #1c130b; cursor: pointer; position: relative; width: 100%; }
      .detail-photo .frame.video-frame.portrait { width: 100%; max-width: 340px; margin: 0 auto; }
      .detail-photo .frame.video-frame img { width: 100%; height: 100%; max-height: none; object-fit: cover; object-position: center center; }
      .tap-hint { margin: 8px 4px 0; font-size: 12px; color: var(--ink-soft); text-align: right; flex: none; }
      .detail-info { padding: 10px 8px 0; flex: 0 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
      .detail-info h3 { font-size: 21px; margin: 0 0 6px; letter-spacing: 0.03em; }
      .detail-info .desc { margin: 0 0 8px; color: var(--ink); font-size: 15px; }
      .info-list { border-top: 1px dashed var(--line); margin: 0; padding: 3px 0 1px; }
      .info-list .row { display: flex; gap: 8px; padding: 2px 0; font-size: 12px; line-height: 1.45; }
      .info-list dt { flex: none; width: 4.2em; color: var(--ink-soft); }
      .info-list dd { margin: 0; }
      .info-list .empty { color: var(--ink-soft); }

      /* ---------- 详情：大屏放大（iPad / 桌面宽屏） ----------
         手机端保持原样；大屏下卡片更宽、照片更高、文字略放大，四周留白明显收窄，
         顶栏页码与关闭键跟随卡片宽度对齐，卡内仍可上下滚动看完整信息 */
      @media (min-width: 900px) {
        .detail-bar { max-width: 1080px; left: 20px; right: 20px; top: max(14px, env(safe-area-inset-top)); }
        .detail-count { font-size: 14px; padding: 4px 12px; }
        .close-btn { width: 36px; height: 36px; font-size: 15px; }
        /* 自适应：卡片整体高度被可视高度封顶，照片区弹性伸缩、信息区超高时在卡内滚动，一屏完整放得下 */
        .detail-slide {
          display: flex; align-items: center; justify-content: center;
          padding: calc(max(14px, env(safe-area-inset-top)) + 52px) 20px calc(20px + env(safe-area-inset-bottom));
          overflow: hidden;
        }
        .detail-item {
          width: 100%; max-width: 1080px; max-height: 100%;
          display: flex; flex-direction: column;
          padding: 14px 14px 13px; border-radius: 22px; overflow: hidden;
        }
        .detail-photo { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
        .detail-photo .frame { flex: 1 1 auto; min-height: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
        .detail-photo img { width: 100%; height: 100%; max-height: none; object-fit: cover; object-position: center center; }
        .tap-hint { font-size: 13px; margin-top: 10px; flex: none; }
        .detail-info { flex: none; max-height: 42%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 10px 0; }
        .detail-info h3 { font-size: 26px; margin-bottom: 8px; }
        .detail-info .desc { font-size: 17px; margin-bottom: 10px; }
        .info-list { padding-top: 5px; }
        .info-list .row { font-size: 14px; line-height: 1.5; padding: 4px 0; }
      }
      @media (min-width: 1400px) {
        .detail-bar { max-width: 1200px; }
        .detail-item { max-width: 1200px; padding: 16px 16px 15px; }
        .detail-info h3 { font-size: 28px; }
        .detail-info .desc { font-size: 18px; }
        .info-list .row { font-size: 15px; }
      }
      /* ---------- 详情：横屏 / 高度受限时一屏完整显示 ----------

        g1.gain.exponentialRampToValueAtTime(0.0008, t + dur);
        o1.connect(g1); g1.connect(musicBus);
        o1.start(t); o1.stop(t + dur + 0.05);
        var o2 = audioCtx.createOscillator();
        o2.type = "triangle"; o2.frequency.value = freq * 2;
        var g2 = audioCtx.createGain();
        g2.gain.setValueAtTime(vol * 0.18, t);
        g2.gain.setTargetAtTime(0, t, dur * 0.35);
        o2.connect(g2); g2.connect(musicBus);
        o2.start(t); o2.stop(t + dur + 0.05);
      }
      /* 一小节：低音垫底，和弦音错开成琶音，旋律在高一个八度上唱 */
      function scheduleBar(bar, t) {
        scheduleNote(mf(bar[0]), t, 0.34, BAR * 1.05);
        for (var k = 0; k < bar.length; k++) {
          scheduleNote(mf(bar[k]), t + 0.55 + k * 1.15, 0.13, 2.2);
        }
        var mel;
        if (bar.length === 4) mel = [bar[3], bar[2], bar[1], bar[0]];
        else mel = [bar[2], bar[2], bar[1], bar[2]];
        for (var j = 0; j < 4; j++) {
          scheduleNote(mf(mel[j] + 12), t + j * 1.15, 0.26, 1.9);
        }
      }
      /* 前视调度：不断提前把接下来的小节排好，八小节循环往复 */
      function musicTick() {
        if (!audioCtx) return;
        while (nextBarTime < audioCtx.currentTime + 1.1) {
          if (nextBarTime < audioCtx.currentTime - 0.2) nextBarTime = audioCtx.currentTime + 0.05;
          scheduleBar(BARS[barIdx % BARS.length], nextBarTime);
          nextBarTime += BAR;
          barIdx++;
        }
      }
      /* 当前是否有“带声音正在播放”的视频：有则音乐让开 */
      function videoSoundActive() {
        if (!viewer || viewer.hidden) return false;
        var v = curVid();
        return !!(v && !v.paused && !v.ended && !globalMuted);
      }
      function refreshMusicLevel() {
        if (!audioCtx || !musicBus) return;
        var target = (musicOn && !videoSoundActive()) ? MUSIC_VOL : 0;
        try { musicBus.gain.setTargetAtTime(target, audioCtx.currentTime, 0.35); } catch (e) {}
      }
      function ensureCtx() {
        if (audioCtx) return true;
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        try {
          audioCtx = new AC();
          musicBus = audioCtx.createGain();
          musicBus.gain.value = 0;
          musicBus.connect(audioCtx.destination);
        } catch (e) { audioCtx = null; musicBus = null; return false; }
        return true;
      }
      function tryStartMusic() {
        if (!musicOn) return;
        if (!ensureCtx()) return;
        var go = function () {
          if (!musicOn || !audioCtx || audioCtx.state !== "running") return;
          if (!musicTimer) {
            nextBarTime = audioCtx.currentTime + 0.08;
            barIdx = 0;
            musicTimer = setInterval(musicTick, 240);
            musicTick();
          }
          refreshMusicLevel();
        };
        var p = null;
        try { p = audioCtx.resume(); } catch (e) {}
        if (p && p.then) { p.then(go).catch(function () {}); } else { go(); }
      }
      function stopMusic() {
        if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
        if (audioCtx && musicBus) {
          try { musicBus.gain.setTargetAtTime(0, audioCtx.currentTime, 0.15); } catch (e) {}
        }
      }
      function updateMusicBtn() {
        musicBtn.setAttribute("aria-pressed", musicOn ? "true" : "false");
        musicBtn.setAttribute("aria-label", musicOn ? "关闭背景音乐" : "打开背景音乐");
        musicBtnText.textContent = musicOn ? "音乐开" : "音乐关";
        musicBtn.classList.toggle("off", !musicOn);
      }
      musicBtn.addEventListener("click", function () {
        musicOn = !musicOn;
        updateMusicBtn();
        if (musicOn) tryStartMusic(); else stopMusic();
      });
      /* 打开页面先尝试自动播放；被浏览器拦截时，等第一次点按页面任意处再自动开始 */
      updateMusicBtn();
      tryStartMusic();
      var musicKick = function () {
        if (musicTimer) { document.removeEventListener("pointerdown", musicKick, true); return; }
        tryStartMusic();
      };
      document.addEventListener("pointerdown", musicKick, true);
      function goPrev() { goToViewer(vIndex - 1, false); }
      function goNext() { goToViewer(vIndex + 1, false); }

      window.addEventListener("resize", function () {
        if (!detailView.hidden) { detailStage.classList.add("dragging"); layoutStack(); void detailStage.offsetWidth; detailStage.classList.remove("dragging"); }
        if (!viewer.hidden) { track.classList.add("dragging"); applyTrack(0); void track.offsetWidth; track.classList.remove("dragging"); }
      });

      var pointers = {};
      var pinchDist = 0, pinchScale = 1, dragStart = null, swipeStart = null;
      var dragOffset = 0, trackDragging = false;
      var vMode = null, vDragY = 0, vExitDragging = false;
      /* 滑动后吞掉紧接着的那次 click，避免误触视频播放/暂停 */
      stage.addEventListener("click", function (e) {
        if (Date.now() < suppressVideoClickUntil) {
          e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
          suppressVideoClickUntil = 0;
        }
      }, true);
      stage.addEventListener("pointerdown", function (e) {
        if (vExiting) return;
        var isVideoTarget = curItem().type === "video" && e.target && e.target.tagName === "VIDEO";
        if (isVideoTarget) {
          /* 底部控件条（播放/暂停、进度、声音、全屏）区域不抢手势，点击照常给播放器 */
          var rect = e.target.getBoundingClientRect();
          var controlH = Math.max(48, Math.min(64, rect.height * 0.18));
          if (e.clientY >= rect.bottom - controlH) return;
          swipeFromVideo = true;
        } else {
          swipeFromVideo = false;
        }
        pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
        /* 视频起手时先不抢指针捕获，等确认是滑动再接管，否则会吞掉控件点击 */
        if (!isVideoTarget) { try { stage.setPointerCapture(e.pointerId); } catch (err) {} }
        var pts = Object.values(pointers);
        if (pts.length === 1) {
          swipeStart = { x: e.clientX, y: e.clientY, scale: vScale };
          dragOffset = 0; trackDragging = false;
          vMode = null; vDragY = 0; vExitDragging = false;
        } else {
          swipeStart = null;
          if (trackDragging) { trackDragging = false; dragOffset = 0; track.classList.remove("dragging"); applyTrack(0); }
          if (vExitDragging) {
            vExitDragging = false; vDragY = 0; vMode = null;
            track.classList.remove("dragging");
            track.style.opacity = ""; viewerCap.style.opacity = "";
            applyTrack(0, 0);
          }
        }
        if (pts.length === 2) {
          pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          pinchScale = vScale;
        }
        dragStart = { x: e.clientX, y: e.clientY, vx: vX, vy: vY };
      });
      stage.addEventListener("pointermove", function (e) {
        if (!pointers[e.pointerId]) return;
        pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
        var pts = Object.values(pointers);
        if (pts.length === 2) {
          var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          if (pinchDist > 0) setScale(pinchScale * d / pinchDist);
        } else if (pts.length === 1 && dragStart && vScale > 1) {
          vX = dragStart.vx + (e.clientX - dragStart.x);
          vY = dragStart.vy + (e.clientY - dragStart.y);
          clampPan(); applyV();
        } else if (pts.length === 1 && swipeStart && vScale === 1) {
          var dx = e.clientX - swipeStart.x;
          var dy = e.clientY - swipeStart.y;
          /* 主方向锁定：横向为主左右滑换图；纵向向下为主下滑退出；向上纵滑忽略 */
          if (!vMode) {
            if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
            if (Math.abs(dx) > Math.abs(dy) * 1.15) vMode = "h";
            else if (Math.abs(dy) > Math.abs(dx) * 1.15) vMode = dy > 0 ? "v" : "lock";
            else return;
          }
          if (vMode === "h") {
            if (!trackDragging) {
              trackDragging = true;
              track.classList.add("dragging");
              if (swipeFromVideo) {
                suppressVideoClickUntil = Date.now() + 500;
                try { stage.setPointerCapture(e.pointerId); } catch (err) {}
              }
            }
            var eff = dx;
            /* 第一张继续右拖、最后一张继续左拖时加阻尼 */
            if ((vIndex === 0 && dx > 0) || (vIndex === detailList.length - 1 && dx < 0)) eff = dx * 0.35;
            dragOffset = eff;
            applyTrack(dragOffset);
          } else if (vMode === "v") {
            /* 下滑退出：照片/视频跟手下移并渐淡 */
            if (!vExitDragging) {
              vExitDragging = true;
              track.classList.add("dragging");
              if (swipeFromVideo) {
                suppressVideoClickUntil = Date.now() + 500;
                try { stage.setPointerCapture(e.pointerId); } catch (err) {}
              }
            }
            vDragY = dy;
            var hh = stage.clientHeight || window.innerHeight || 1;
            track.style.opacity = Math.max(0.25, 1 - (dy / hh) * 0.9);
            viewerCap.style.opacity = Math.max(0, 1 - dy / 120);
            applyTrack(0, dy);
          }
        }
      });
      function endPointer(e) {
        var wasLast = Object.keys(pointers).length === 1 && pointers[e.pointerId];
        delete pointers[e.pointerId];
        if (Object.keys(pointers).length < 2) pinchDist = 0;
        if (Object.keys(pointers).length === 0) {
          if (wasLast && swipeStart && swipeStart.scale === 1 && vScale === 1 && e.type === "pointerup") {
            var dx = e.clientX - swipeStart.x;
            var dy = e.clientY - swipeStart.y;
            var w = stage.clientWidth || window.innerWidth || 1;
            var hh = stage.clientHeight || window.innerHeight || 1;
            var threshold = Math.max(48, Math.min(88, w * 0.18));
            var thY = Math.max(70, Math.min(120, hh * 0.16));
            track.classList.remove("dragging");
            if ((trackDragging || vExitDragging) && swipeFromVideo) suppressVideoClickUntil = Date.now() + 500;
            if (vExitDragging) {
              if (dy >= thY && dy > Math.abs(dx) * 1.2) {
                commitViewerExit(); /* 下滑过阈值：继续下滑淡出，退出回三级 */
              } else {
                /* 没滑够：照片弹回原位、恢复不透明 */
                track.style.opacity = "";
                viewerCap.style.opacity = "";
                applyTrack(0, 0);
              }
            } else if (trackDragging && Math.abs(dx) >= threshold && Math.abs(dx) > Math.abs(dy) * 1.2) {
              if (dx < 0 && vIndex < detailList.length - 1) goToViewer(vIndex + 1, false);
              else if (dx > 0 && vIndex > 0) goToViewer(vIndex - 1, false);
              else applyTrack(0);
            } else if (trackDragging) {
              applyTrack(0); /* 没滑够：平滑弹回原图 */
            }
          } else if (trackDragging || vExitDragging) {
            track.classList.remove("dragging");
            track.style.opacity = "";
            viewerCap.style.opacity = "";
            applyTrack(0, 0);
          }
          swipeStart = null;
          dragStart = null;
          dragOffset = 0; trackDragging = false;
          vMode = null; vDragY = 0; vExitDragging = false; swipeFromVideo = false;
        }
      }
      stage.addEventListener("pointerup", endPointer);
      stage.addEventListener("pointercancel", endPointer);
      stage.addEventListener("wheel", function (e) {
        if (curItem().type !== "photo") return;
        e.preventDefault();
        setScale(vScale * (e.deltaY < 0 ? 1.12 : 0.89));
      }, { passive: false });
      stage.addEventListener("dblclick", function () {
        if (curItem().type !== "photo") return;
        setScale(vScale > 1 ? 1 : 2.5);
      });

      document.addEventListener("keydown", function (e) {
        if (!viewer.hidden) {
          if (e.key === "Escape") closeViewer();
          if (e.key === "ArrowLeft") goPrev();
          if (e.key === "ArrowRight") goNext();
          return;
        }
        if (detailView.hidden) return;
        if (e.key === "Escape") closeDetail();
        if (e.key === "ArrowLeft") goToDetail(dIndex - 1, false);
        if (e.key === "ArrowRight") goToDetail(dIndex + 1, false);
      });
    </script>
  </body>
</html>
